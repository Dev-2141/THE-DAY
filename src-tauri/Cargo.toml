[package]
name = "the-day"
version = "1.0.0"
description = "THE DAY: a living poster home screen"
edition = "2021"
rust-version = "1.80"

[lib]
name = "the_day_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"

[profile.release]
# Smaller, faster release binary.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
# Lean debug builds, so the Android debug APK stays a sensible size: line
# numbers for this crate (enough for readable backtraces), none for dependencies.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
