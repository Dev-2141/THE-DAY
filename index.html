<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090807" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="THE DAY: a living poster home screen." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>THE DAY</title>
    <style>
      /* The splash shows before any script runs; the app's loading screen
         (src/ui/LoadingScreen.tsx) takes over with the same look. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e9dcc7;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 38%, #f4ecdf 0%, #e9dcc7 55%, #cdbfa8 100%);
        color: #090807;
        font-family: Didot, 'Bodoni MT', 'Bodoni 72', serif;
      }
      #splash .t {
        font-size: clamp(22px, 5vw, 34px);
        letter-spacing: 0.32em;
        margin-right: -0.32em;
      }
      #splash .r {
        width: min(48vw, 300px);
        height: 1px;
        margin: 12px 0 10px;
        background: rgba(9, 8, 7, 0.16);
      }
      #splash .d {
        font-size: clamp(56px, 15vw, 104px);
        line-height: 1;
        letter-spacing: 0.08em;
        margin-right: -0.08em;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="t">THE</div>
      <div class="r"></div>
      <div class="d">DAY</div>
    </div>
    <div id="root"></div>
    <noscript>THE DAY needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
